; ============================================================================
; PLATFORMIO ENVIRONMENT CONFIGURATION: UNIVERSAL MECHATRONIC CORE V1.2
; Target Hardware: ESP32-S3-WROOM-1-N8R8 (Dual-Core RISC-V, 240MHz, 8MB Flash)
; Classification: Industrial Multi-Axis Closed-Loop Automation Controller
; ============================================================================

[env:esp32s3_automation_core]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Master Clock Optimization: Maximize execution cadence to 240MHz
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; High-Performance Industrial Compiler Optimization Flags
build_flags = 
    -O3
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; Shared High-Speed Local Offline I2C/SPI Sensor & Display Libraries
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
